<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ordis — YOUR_SERVER_IP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --abyss:#050507;
    --carbon:#101010;
    --carbon2:#151515;
    --charcoal:#3d3a39;
    --charcoal-dim:#282524;
    --signal:#00d992;
    --signal-dim:rgba(0,217,146,.12);
    --mint:#2fd6a1;
    --snow:#f2f2f2;
    --parchment:#b8b3b0;
    --slate:#8b949e;
    --slate2:#5c5a58;
    --danger:#fb565b;
    --danger-dim:rgba(251,86,91,.12);
    --warn:#ffba00;
    --warn-dim:rgba(255,186,0,.1);
    --mono:'JetBrains Mono',ui-monospace,SF Mono,Consolas,monospace;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
  body{background:var(--abyss);color:var(--snow);font-family:var(--sans);font-size:14px;line-height:1.5;min-height:100vh;overflow-x:hidden}
  .reveal{opacity:0;transform:translateY(18px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1)}
  .reveal.visible{opacity:1;transform:translateY(0)}
  .reveal-1{transition-delay:.05s}.reveal-2{transition-delay:.1s}.reveal-3{transition-delay:.15s}.reveal-4{transition-delay:.2s}.reveal-5{transition-delay:.25s}.reveal-6{transition-delay:.3s}
  .shell{max-width:1280px;margin:0 auto;padding:0 24px}

  /* TOPBAR */
  .topbar{border-bottom:1px solid var(--charcoal);background:var(--carbon);position:sticky;top:0;z-index:20}
  .topbar-inner{max-width:1280px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:14px}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px;letter-spacing:-.02em;color:var(--snow)}
  .brand-dot{width:7px;height:7px;border-radius:50%;background:var(--signal);box-shadow:0 0 8px var(--signal);animation:glow 2.5s ease-in-out infinite}
  @keyframes glow{0%,100%{box-shadow:0 0 4px var(--signal)}50%{box-shadow:0 0 14px var(--signal),0 0 28px rgba(0,217,146,.3)}}
  .host{font-family:var(--mono);font-size:11px;color:var(--slate);padding:2px 7px;border:1px solid var(--charcoal);border-radius:4px;background:var(--abyss)}
  .spacer{flex:1}
  .heartbeat{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--slate)}

  /* VERDICT */
  .verdict{padding:28px 0 20px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .verdict h1{font-family:system-ui;font-size:28px;font-weight:600;letter-spacing:-.03em;color:var(--snow)}
  .verdict .sub{color:var(--slate);font-size:13px}
  .badge{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 8px;border-radius:3px;letter-spacing:.05em;text-transform:uppercase}
  .badge.ok{background:rgba(0,217,146,.1);color:var(--signal);border:1px solid rgba(0,217,146,.2)}

  /* METRIC GRID */
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1px;background:var(--charcoal);border:1px solid var(--charcoal);border-radius:8px;overflow:hidden}
  .metric-cell{background:var(--carbon);display:flex;flex-direction:column}
  .metric{background:var(--carbon);padding:16px 18px 14px;cursor:pointer;user-select:none;transition:background .2s,border-color .2s;border-left:2px solid transparent}
  .metric:hover{background:var(--carbon2)}
  .metric.active{border-left-color:var(--signal)}
  .metric-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .metric-label{font-family:system-ui;font-size:11px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.06em}
  .metric-state{font-family:var(--mono);font-size:9.5px;font-weight:600;padding:2px 6px;border-radius:3px;letter-spacing:.03em}
  .metric-state.ok{background:rgba(0,217,146,.1);color:var(--signal)}
  .metric-state.warn{background:var(--warn-dim);color:var(--warn)}
  .metric-state.crit{background:var(--danger-dim);color:var(--danger)}
  .metric-value{font-family:system-ui;font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.05;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:3px;color:var(--snow)}
  .metric-value .unit{font-size:13px;font-weight:500;color:var(--slate)}
  .metric-detail{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--slate)}
  .bar{margin-top:10px;height:2px;border-radius:1px;background:var(--charcoal-dim);overflow:hidden}
  .bar-fill{height:100%;border-radius:1px;background:var(--signal);transition:width .6s cubic-bezier(.4,0,.2,1)}
  .bar-fill.warn{background:var(--warn)}
  .bar-fill.crit{background:var(--danger)}

  /* DRAWER */
  .metric-drawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.16,1,.3,1);border-top:1px solid transparent}
  .metric-drawer.open{grid-template-rows:1fr;border-color:var(--charcoal)}
  .metric-drawer-inner{overflow:hidden}
  .drawer-content{padding:14px 18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  .drawer-stat{text-align:center}
  .drawer-stat .val{font-family:system-ui;font-size:20px;font-weight:600;color:var(--snow);letter-spacing:-.02em}
  .drawer-stat .lbl{font-size:10px;color:var(--slate);margin-top:3px;text-transform:uppercase;letter-spacing:.05em}
  .drawer-breakdown{grid-column:1/-1;display:flex;gap:0;height:6px;border-radius:3px;overflow:hidden;margin-top:4px}
  .drawer-breakdown span{height:100%;transition:width .6s cubic-bezier(.4,0,.2,1)}
  .seg-app{background:var(--signal)}
  .seg-system{background:#306cce}
  .seg-cache{background:var(--warn)}
  .seg-free{background:var(--charcoal)}

  /* SECTION */
  .section{margin-top:40px}
  .section-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .section-head h2{font-family:system-ui;font-size:12px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.08em}
  .section-head .rule{flex:1;height:1px;background:var(--charcoal)}
  .section-head .count{font-family:var(--mono);font-size:10.5px;color:var(--slate2)}

  /* SERVICES */
  .services{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
  .svc{background:var(--carbon);border:1px solid var(--charcoal);border-radius:6px;padding:12px 14px;display:flex;align-items:center;gap:11px;transition:border-color .15s}
  .svc:hover{border-color:var(--slate2)}
  .svc-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--signal);box-shadow:0 0 6px rgba(0,217,146,.5)}
  .svc-dot.down{background:var(--danger);box-shadow:0 0 6px rgba(251,86,91,.5)}
  .svc-body{flex:1;min-width:0}
  .svc-name{font-weight:550;font-size:13px;letter-spacing:-.01em}
  .svc-meta{font-family:var(--mono);font-size:10.5px;color:var(--slate);margin-top:2px}
  .svc-uptime{font-family:var(--mono);font-size:11px;color:var(--parchment);text-align:right;flex:none}
  .svc-uptime b{display:block;color:var(--snow);font-weight:600;font-size:12.5px}

  /* EVENTS */
  .events{border:1px solid var(--charcoal);border-radius:6px;background:var(--carbon);overflow:hidden}
  .ev{display:grid;grid-template-columns:128px 1fr auto;gap:14px;align-items:start;padding:11px 14px;border-bottom:1px solid var(--charcoal);transition:background .12s}
  .ev:last-child{border-bottom:none}
  .ev:hover{background:var(--carbon2)}
  .ev-time{font-family:var(--mono);font-size:11px;color:var(--slate2);padding-top:1px}
  .ev-rule{font-size:12.5px;font-weight:550;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
  .chip{font-family:var(--mono);font-size:9.5px;font-weight:600;padding:1px 5px;border-radius:3px;background:var(--charcoal-dim);color:var(--slate);letter-spacing:.02em}
  .chip.sec{background:var(--danger-dim);color:var(--danger)}
  .ev-action{font-family:var(--mono);font-size:11px;color:var(--parchment);margin-top:3px;word-break:break-all}
  .ev-action .arrow{color:var(--slate);margin-right:4px}
  .ev-result{font-family:var(--mono);font-size:10px;font-weight:600;padding:2px 7px;border-radius:3px;white-space:nowrap}
  .ev-result.healed{background:rgba(0,217,146,.1);color:var(--signal)}
  .ev-result.failed{background:var(--danger-dim);color:var(--danger)}

  /* RULES */
  .rules{border:1px solid var(--charcoal);border-radius:6px;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  thead th{background:var(--carbon2);text-align:left;padding:9px 14px;font-size:10px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--charcoal)}
  tbody td{padding:10px 14px;border-bottom:1px solid var(--charcoal);background:var(--carbon)}
  tbody td.mono{font-family:var(--mono);font-size:11px;color:var(--parchment)}
  .toggle{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:600;cursor:pointer}
  .toggle-track{width:24px;height:13px;border-radius:7px;background:var(--signal);position:relative;transition:background .2s}
  .toggle-track::after{content:'';position:absolute;top:2px;right:2px;width:9px;height:9px;border-radius:50%;background:#050507}
  .toggle-track.off{background:var(--charcoal-dim)}
  .toggle-track.off::after{right:auto;left:2px;background:var(--slate)}

  /* CHAT */
  .chat-panel{border:1px solid var(--charcoal);border-radius:6px;background:var(--carbon);overflow:hidden;display:flex;flex-direction:column;height:400px}
  .chat-messages{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
  .chat-msg{max-width:80%;padding:9px 13px;border-radius:6px;font-size:13px;line-height:1.55;animation:msgIn .25s cubic-bezier(.16,1,.3,1)}
  @keyframes msgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  .chat-msg.user{align-self:flex-end;background:var(--signal);color:#050507;font-weight:550}
  .chat-msg.bot{align-self:flex-start;background:var(--carbon2);color:var(--snow);border:1px solid var(--charcoal)}
  .chat-msg .ts{font-family:var(--mono);font-size:9.5px;color:var(--slate);margin-top:5px;text-align:right}
  .chat-msg.user .ts{color:rgba(0,0,0,.5)}
  .chat-msg.typing{padding:12px 15px;display:flex;gap:4px;align-items:center}
  .chat-msg.typing .dot{width:6px;height:6px;border-radius:50%;background:var(--signal);animation:dotBounce 1.3s ease-in-out infinite}
  .chat-msg.typing .dot:nth-child(2){animation-delay:.15s}
  .chat-msg.typing .dot:nth-child(3){animation-delay:.3s}
  @keyframes dotBounce{0%,80%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}
  .chat-input-row{display:flex;gap:8px;border-top:1px solid var(--charcoal);padding:11px 14px;background:var(--carbon2)}
  .chat-input-row input{flex:1;background:var(--abyss);border:1px solid var(--charcoal);border-radius:5px;padding:9px 13px;color:var(--snow);font-family:var(--sans);font-size:13px;outline:none;transition:border-color .2s}
  .chat-input-row input:focus{border-color:var(--signal)}
  .chat-input-row input::placeholder{color:var(--slate2)}
  .chat-input-row button{padding:0 16px;background:var(--signal);color:#050507;border:none;border-radius:5px;font-weight:600;font-size:12.5px;cursor:pointer;transition:opacity .15s}
  .chat-input-row button:hover{opacity:.8}
  .chat-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--slate2);font-size:13px;flex-direction:column;gap:5px}
  .chat-empty .icon{font-size:28px;color:var(--signal);opacity:.4;margin-bottom:2px}

  /* LOGIN */
  .login-overlay{position:fixed;inset:0;z-index:100;background:var(--abyss);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}
  .login-overlay.hidden{display:none}
  .login-card{background:var(--carbon);border:1px solid var(--charcoal);border-radius:8px;padding:36px 32px;width:340px;max-width:90vw;text-align:center}
  .login-desc{color:var(--slate);font-size:12.5px;margin-bottom:22px}
  .login-input{width:100%;background:var(--abyss);border:1px solid var(--charcoal);border-radius:6px;padding:11px 15px;color:var(--snow);font-family:var(--mono);font-size:15px;text-align:center;letter-spacing:.12em;outline:none;transition:border-color .2s}
  .login-input:focus{border-color:var(--signal)}
  .login-input.error{border-color:var(--danger);animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
  .login-btn{width:100%;margin-top:11px;padding:11px;background:var(--signal);color:#050507;border:none;border-radius:6px;font-size:13.5px;font-weight:600;cursor:pointer;transition:opacity .15s}
  .login-btn:hover{opacity:.85}
  .login-btn:disabled{opacity:.35;cursor:not-allowed}
  .login-err{color:var(--danger);font-size:11.5px;margin-top:9px;min-height:17px;font-family:var(--mono)}
  .login-attempts{display:flex;gap:5px;justify-content:center;margin-top:5px}
  .login-attempts span{width:7px;height:7px;border-radius:50%;background:var(--charcoal-dim);transition:background .3s}
  .login-attempts span.used{background:var(--danger)}

  footer{margin:40px 0 28px;padding-top:16px;border-top:1px solid var(--charcoal);display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10.5px;color:var(--slate2);flex-wrap:wrap;gap:10px}
  footer a{color:var(--parchment);text-decoration:none}
  footer a:hover{color:var(--signal)}
  @media(max-width:640px){.shell,.topbar-inner{padding-left:14px;padding-right:14px}.verdict h1{font-size:22px}.ev{grid-template-columns:1fr;gap:5px}.rules{overflow-x:auto}}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-card">
    <div class="brand" style="justify-content:center;margin-bottom:6px">
      <span class="brand-dot"></span>Ordis
    </div>
    <div class="login-desc">飞船中枢 · 认证接入</div>
    <input type="password" class="login-input" id="loginInput" placeholder="密钥" autofocus onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" id="loginBtn" onclick="doLogin()">认证</button>
    <div class="login-err" id="loginErr"></div>
    <div class="login-attempts" id="loginDots"><span></span><span></span><span></span></div>
  </div>
</div>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand"><span class="brand-dot"></span>Ordis</div>
    <span class="host">YOUR_SERVER_IP · ubuntu 24.04</span>
    <div class="spacer"></div>
    <div class="heartbeat"><span id="tick">巡检中 · 30s</span></div>
  </div>
</div>

<div class="shell">
  <div class="verdict reveal reveal-1">
    <h1>系统健康</h1>
    <span class="badge ok">All Clear</span>
    <span class="sub">守护进程运行中 · 数据每 30s 刷新</span>
  </div>

  <!-- METRICS -->
  <div class="grid reveal reveal-2">
    <div class="metric-cell"><div class="metric" onclick="toggleDrawer(this)" data-metric="cpu">
      <div class="metric-head"><span class="metric-label">CPU 负载</span><span class="metric-state ok">正常</span></div>
      <div class="metric-value"><span data-count="0" data-decimals="2"></span><span class="unit">/ 2 核</span></div>
      <div class="bar"><div class="bar-fill" style="width:0%"></div></div>
      <div class="metric-detail">—</div>
    </div></div>
    <div class="metric-cell"><div class="metric" onclick="toggleDrawer(this)" data-metric="mem">
      <div class="metric-head"><span class="metric-label">内存</span><span class="metric-state ok">正常</span></div>
      <div class="metric-value"><span data-count="0" data-suffix=" MB 可用"></span></div>
      <div class="bar"><div class="bar-fill" style="width:0%"></div></div>
      <div class="metric-detail">—</div>
    </div></div>
    <div class="metric-cell"><div class="metric" onclick="toggleDrawer(this)" data-metric="disk">
      <div class="metric-head"><span class="metric-label">磁盘</span><span class="metric-state ok">正常</span></div>
      <div class="metric-value"><span data-count="0" data-suffix="%"></span></div>
      <div class="bar"><div class="bar-fill" style="width:0%"></div></div>
      <div class="metric-detail">—</div>
    </div></div>
    <div class="metric-cell"><div class="metric" onclick="toggleDrawer(this)" data-metric="sec">
      <div class="metric-head"><span class="metric-label">威胁</span><span class="metric-state ok">已拦截</span></div>
      <div class="metric-value"><span data-count="0" data-suffix=" 新增"></span></div>
      <div class="bar"><div class="bar-fill" style="width:0%"></div></div>
      <div class="metric-detail">—</div>
    </div></div>
  </div>

  <!-- SERVICES -->
  <div class="section reveal reveal-3">
    <div class="section-head"><h2>受管服务</h2><span class="rule"></span><span class="count" id="svcCount">—</span></div>
    <div class="services" id="svcList"></div>
  </div>

  <!-- EVENTS -->
  <div class="section reveal reveal-4">
    <div class="section-head"><h2>自愈事件</h2><span class="rule"></span><span class="count" id="evtCount">—</span></div>
    <div class="events" id="evtList"></div>
  </div>

  <!-- RULES -->
  <div class="section reveal reveal-5">
    <div class="section-head"><h2>规则引擎</h2><span class="rule"></span><span class="count" id="ruleCount">—</span></div>
    <div class="rules" id="ruleTable"></div>
  </div>

  <!-- CHAT -->
  <div class="section reveal reveal-6">
    <div class="section-head"><h2>Ordis Chat</h2><span class="rule"></span><span class="count">claude-code v2.1</span></div>
    <div class="chat-panel">
      <div class="chat-messages" id="chatMsgs"><div class="chat-empty" id="chatEmpty"><div class="icon">◈</div><div>向 Ordis 提问服务器状态、执行诊断或请求操作</div></div></div>
      <div class="chat-input-row"><input type="text" id="chatInput" placeholder="输入消息…" onkeydown="if(event.key==='Enter')sendMsg()"><button onclick="sendMsg()">发送</button></div>
    </div>
  </div>

  <footer><span>Ordis v2 · VoltAgent Edition · systemd 托管</span><span><a href="/ordish">初版风格</a> · 数据源 /api/*</span></footer>
</div>

<script>
// ============ LOGIN ============
const PASSWORD='YOUR_PASSWORD',MAX_ATTEMPTS=3,COOLDOWN_MS=30*60*1000;
(function(){const c=parseInt(localStorage.getItem('ordis_cooldown')||'0');if(c>Date.now()){const m=Math.ceil((c-Date.now())/60000);setLocked(`*滋滋* 认证锁定 — ${m} 分钟后重试`);return}if(localStorage.getItem('ordis_authed')==='1'){document.getElementById('loginOverlay').classList.add('hidden');return}updateDots(parseInt(localStorage.getItem('ordis_attempts')||'0'))})();
function doLogin(){const i=document.getElementById('loginInput'),v=i.value;let a=parseInt(localStorage.getItem('ordis_attempts')||'0');if(v===PASSWORD){localStorage.setItem('ordis_authed','1');localStorage.setItem('ordis_attempts','0');localStorage.removeItem('ordis_cooldown');document.getElementById('loginOverlay').classList.add('hidden');return}a++;localStorage.setItem('ordis_attempts',String(a));updateDots(a);i.classList.add('error');setTimeout(()=>i.classList.remove('error'),400);if(a>=MAX_ATTEMPTS){const u=Date.now()+COOLDOWN_MS;localStorage.setItem('ordis_cooldown',String(u));localStorage.setItem('ordis_attempts','0');setLocked('*滋滋* 认证锁定 — 30 分钟后重试')}else{document.getElementById('loginErr').textContent=`认证失败 · 剩余 ${MAX_ATTEMPTS-a} 次`}i.value=''}
function setLocked(msg){const i=document.getElementById('loginInput'),b=document.getElementById('loginBtn');i.disabled=b.disabled=true;document.getElementById('loginErr').textContent=msg;const c=setInterval(()=>{const r=parseInt(localStorage.getItem('ordis_cooldown')||'0')-Date.now();if(r<=0){clearInterval(c);localStorage.removeItem('ordis_cooldown');localStorage.setItem('ordis_attempts','0');i.disabled=b.disabled=false;document.getElementById('loginErr').textContent='';updateDots(0);i.focus()}else{document.getElementById('loginErr').textContent=`*滋滋* 认证锁定 — ${Math.ceil(r/60000)} 分钟后重试`}},30000)}
function updateDots(n){document.querySelectorAll('#loginDots span').forEach((d,i)=>d.classList.toggle('used',i<n))}

// ============ REVEAL ============
new IntersectionObserver(e=>e.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.12}).observe(document.querySelector('.reveal'));
document.querySelectorAll('.reveal').forEach(e=>new IntersectionObserver(e=>e.forEach(e=>{if(e.isIntersecting)e.target.classList.add('visible')}),{threshold:.12}).observe(e));

// ============ DRAWER ============
function toggleDrawer(c){const d=c.nextElementSibling;if(!d||!d.classList.contains('metric-drawer'))return;d.classList.contains('open')?(d.classList.remove('open'),c.classList.remove('active')):(d.classList.add('open'),c.classList.add('active'))}

// ============ LIVE DATA ============
async function refreshAll(){try{const[status,events,rules]=await Promise.all([fetch('/api/status').then(r=>r.json()),fetch('/api/events?n=5').then(r=>r.json()),fetch('/api/rules').then(r=>r.json())]);updateStatus(status);updateEvents(events);updateRules(rules);updateServices(status.process);document.getElementById('tick').textContent='已更新 · '+new Date().toLocaleTimeString('zh-CN',{hour12:false})}catch(e){console.log('refresh:',e)}}

function updateStatus(d){
  document.querySelector('.verdict .sub').innerHTML=`可用内存 <b style="color:var(--snow)">${d.memory?.available_gb?.toFixed(1)||'—'}GB</b> · CPU <b style="color:var(--snow)">${d.cpu?.cpu_percent||'—'}%</b>`;
  const cards=document.querySelectorAll('.metric-value span[data-count]');
  if(cards[0]){cards[0].textContent=d.cpu.load_1min.toFixed(2);cards[0].parentElement.nextElementSibling.style.width=Math.min(d.cpu.cpu_percent,100)+'%';cards[0].parentElement.parentElement.querySelector('.metric-detail').textContent=`5m ${d.cpu.load_5min.toFixed(2)} · 15m ${d.cpu.load_15min.toFixed(2)} · ${d.cpu.cpu_percent}%`}
  if(cards[1]){cards[1].textContent=Math.round(d.memory.available_gb*1024)+' MB 可用';cards[1].parentElement.nextElementSibling.style.width=d.memory.percent+'%';cards[1].parentElement.parentElement.querySelector('.metric-detail').textContent=`已用 ${d.memory.used_gb.toFixed(2)} / ${d.memory.total_gb.toFixed(2)} GB · swap ${Math.round(d.memory.swap_used_gb*1024)}MB`}
  if(cards[2]){cards[2].textContent=d.disk.use_pct.toFixed(1)+'%';cards[2].parentElement.nextElementSibling.style.width=d.disk.use_pct+'%';cards[2].parentElement.parentElement.querySelector('.metric-detail').textContent=`已用 ${d.disk.used_gb.toFixed(1)} GB · 剩余 ${d.disk.free_gb.toFixed(1)} GB`}
  if(cards[3]&&d.security){cards[3].textContent=d.security.failed_attempts+' 新增';cards[3].parentElement.nextElementSibling.style.width='0%';cards[3].parentElement.parentElement.querySelector('.metric-detail').textContent=`封禁 ${Object.keys(d.security.offenders||{}).length} IP · ${d.security.failed_attempts} 次`}
}

function updateServices(proc){
  const svcs=[{name:'photography',port:3000,url:'your-domain.com'},{name:'haigui',port:3001,url:'haigui.your-domain.com'},{name:'claude-chat',port:3002,url:'claude.your-domain.com'},{name:'claude-code CLI',port:-1,url:'v2.1.197 · /api/chat'}];
  const c=document.getElementById('svcList');
  c.innerHTML=svcs.map(s=>{
    const alive=s.port<0||proc?.ports?.[String(s.port)];
    return`<div class="svc"><span class="svc-dot${alive?'':' down'}"></span><div class="svc-body"><div class="svc-name">${s.name}</div><div class="svc-meta">${s.port>0?':'+s.port+' · ':''}${s.url}</div></div><div class="svc-uptime"><b>${alive?'在线':'离线'}</b></div></div>`;
  }).join('');
  document.getElementById('svcCount').textContent=`${svcs.filter(s=>s.port<0||proc?.ports?.[String(s.port)]).length} / ${svcs.length} 在线`;
  // Dot breathing
  document.querySelectorAll('.svc-dot:not(.down)').forEach(d=>{d.style.animation='dotBreathe 2.8s ease-in-out infinite';d.style.animationDelay=Math.random()*1.5+'s'});
}

function updateEvents(events){
  const c=document.getElementById('evtList');
  if(!events.length){c.innerHTML='<div class="ev"><div class="ev-time" style="grid-column:1/-1;text-align:center;color:var(--slate)">暂无事件</div></div>';document.getElementById('evtCount').textContent='无';return}
  const chips={security:'chip sec',process:'chip',memory:'chip',disk:'chip',cpu:'chip',system:'chip'};
  c.innerHTML=events.map(e=>{const h=e.heal||{},ok=h.success,act=h.actions?.[0];return`<div class="ev"><div class="ev-time">${e.time}</div><div class="ev-body"><div class="ev-rule">${e.rule} <span class="${chips[e.collector]||'chip'}">${e.collector}</span></div>${act?`<div class="ev-action"><span class="arrow">└</span>${act.action||''} — ${act.detail?.slice(0,50)||''}</div>`:''}</div><span class="ev-result ${ok?'healed':'failed'}">${ok?'已修复':'失败'}</span></div>`}).join('');
  document.getElementById('evtCount').textContent=`最近 ${events.length} 条`;
}

function updateRules(rules){
  const c=document.getElementById('ruleTable'),rl=rules.rules||[];
  let h='<table><thead><tr><th>规则</th><th>采集器</th><th>条件</th><th>修复器</th><th>冷却</th><th>状态</th></tr></thead><tbody>';
  h+=rl.map(r=>`<tr><td>${r.name}</td><td class="mono">${r.collector}</td><td class="mono">${r.threshold||r.condition||'—'}</td><td class="mono">${r.healer||'—'}</td><td class="mono">${r.cooldown||'—'}s</td><td><span class="toggle" style="cursor:pointer"><span class="toggle-track${r.enabled===false?' off':''}" onclick="this.classList.toggle('off');this.parentElement.childNodes[1]&&(this.parentElement.childNodes[1].textContent=this.classList.contains('off')?'OFF':'ON')"></span>${r.enabled!==false?'ON':'OFF'}</span></td></tr>`).join('');
  h+='</tbody></table>';
  c.innerHTML=h;
  document.getElementById('ruleCount').textContent=`${rl.length} 条`;
}

// ============ CHAT ============
function sendMsg(){const i=document.getElementById('chatInput'),m=i.value.trim();if(!m)return;i.value='';addMsg('user',m);document.getElementById('chatEmpty')?.remove();const t=addTyping();fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})}).then(r=>r.json()).then(d=>{t.remove();addMsg('bot',d.reply||d.error||'无响应')}).catch(e=>{t.remove();addMsg('bot','请求失败：'+e.message)})}
function addTyping(){const d=document.createElement('div');d.className='chat-msg bot typing';d.innerHTML='<span class="dot"></span><span class="dot"></span><span class="dot"></span>';document.getElementById('chatMsgs').appendChild(d);document.getElementById('chatMsgs').scrollTop=document.getElementById('chatMsgs').scrollHeight;return d}
function addMsg(t,x){const d=document.createElement('div');d.className='chat-msg '+t;const n=new Date().toLocaleTimeString('zh-CN',{hour12:false});d.innerHTML=x+`<div class="ts">${n}</div>`;document.getElementById('chatMsgs').appendChild(d);document.getElementById('chatMsgs').scrollTop=document.getElementById('chatMsgs').scrollHeight}

// ============ HEARTBEAT ============
let s=30;setInterval(()=>{s=s<=1?30:s-1;if(!document.getElementById('tick').textContent.startsWith('已更新'))document.getElementById('tick').textContent=`巡检中 · ${s}s`},1000);

// Init
refreshAll();setInterval(refreshAll,30000);
</script>
</body>
</html>
