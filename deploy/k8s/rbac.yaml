apiVersion: v1
kind: Namespace
metadata:
  name: ordis-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ordis
  namespace: ordis-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ordis-readonly
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods", "persistentvolumeclaims", "services", "endpoints"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ordis-readonly
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ordis-readonly
subjects:
  - kind: ServiceAccount
    name: ordis
    namespace: ordis-system
