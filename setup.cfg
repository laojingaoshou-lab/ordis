[metadata]
name = ordis-self-healing
version = attr: ordis.__version__
description = Lightweight server self-healing and AI-assisted operations demo
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT

[options]
packages = find:
python_requires = >=3.9
include_package_data = True
install_requires =
    psutil>=5.9.0
    pyyaml>=6.0
    requests>=2.31.0
    fastapi>=0.110.0
    uvicorn>=0.27.0

[options.packages.find]
include = ordis*

[options.package_data]
ordis =
    rules.yaml
    dashboard.html

[options.entry_points]
console_scripts =
    ordis = ordis.ordisd:main
